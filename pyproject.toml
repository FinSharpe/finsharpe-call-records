[project]
name = "finsharpe-call-records"
version = "0.1.1"
description = "Call Record emission for FinSharpe MCP providers"
readme = "README.md"
# Deliberately the lowest floor any provider declares. This library's whole job
# is to install into all of them; a floor above tradekit's own >=3.10 made the
# dependency unresolvable rather than merely inconvenient.
requires-python = ">=3.10"
dependencies = [
    # Floor, not a pin: providers deploy independently and several versions of
    # this library are live at once, so it must install alongside whatever
    # FastMCP each of them already has. 3.2.4 is the version validated across
    # the providers today; the middleware interface has been stable since 2.9.
    # CEILING (Sept 2026): fastmcp 4.0.0 moved to `fastmcp-slim`, which requires
    # `mcp>=2.0`, and mcp 2.x dropped `mcp.shared.context.RequestContext`. That
    # is what crash-looped the agents deployment, via an unbounded fastmcp in
    # `finsharpe-agents/libs/tradekit`. The providers are held below fastmcp 4
    # together so the ecosystem crosses that major in one deliberate move rather
    # than one image build at a time.
    "fastmcp>=3.2.4,<4",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finsharpe_call_records"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
